<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Almanack</title>
<style>
:root{color-scheme:dark;--ink:#d8dee9;--muted:#687080;--line:#303642;--paper:#171a21;--panel:#20242d;--accent:#88c0d0;--select:#303846}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{min-height:100vh;background:var(--paper);color:var(--ink);font:14px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.app{display:grid;grid-template-columns:minmax(0,1fr) 310px;min-height:100vh}.reader{min-width:0;padding:44px clamp(28px,7vw,110px)}.content{max-width:860px;margin:0 auto}.content h1{color:#eceff4;font-size:clamp(30px,5vw,58px);line-height:1.05;letter-spacing:-.07em;font-weight:600;margin:0 0 28px}.content h2{color:var(--accent);font-size:24px;margin:42px 0 12px}.content h3{color:#b48ead;font-size:17px;margin:30px 0 8px}.content p{max-width:760px;margin:0 0 20px}.content a{color:var(--accent)}.content img{max-width:100%;height:auto}.content blockquote{margin:28px 0;padding-left:18px;border-left:2px solid var(--accent);color:#aab3c2}.content pre{overflow-x:auto;padding:18px;background:#101217;border:1px solid var(--line);font-size:13px}.content code{font:inherit;color:#a3be8c;background:#101217;padding:2px 4px}.content pre code{padding:0}.explorer{padding:22px 18px;background:var(--panel);border-left:1px solid var(--line);order:2}.explorer h1{margin:0 0 26px;color:#eceff4;font-size:14px;font-weight:600}.folder{color:var(--muted);font-size:12px;margin:0 0 8px}.file{display:block;width:100%;padding:7px 10px;border:0;border-left:2px solid transparent;background:none;color:#b8c0ce;cursor:pointer;text-align:left;font:inherit;font-size:12px;overflow-wrap:anywhere}.file:hover{color:var(--ink);background:#272d38}.file.active{color:#eceff4;background:var(--select);border-left-color:var(--accent)}.status{margin-top:34px;color:var(--muted);font-size:11px}iframe{display:block;width:100%;min-height:calc(100vh - 88px);border:1px solid var(--line);background:white}@media(max-width:700px){.app{grid-template-columns:1fr}.explorer{order:2;border-left:0;border-top:1px solid var(--line);padding:18px 24px}.explorer h1{margin-bottom:14px}.file{display:inline-block;width:auto;margin-right:4px}.status{display:none}.reader{padding:28px 22px}}
</style></head><body>
<div class="app"><main class="reader"><article class="content" id="content" aria-live="polite"></article></main><aside class="explorer" aria-label="File explorer"><h1>[D]  ALMANACK</h1><p class="folder">[D] me/</p><button class="file active" data-path="almanack/me/about.html" data-type="html">[F]  about.html</button><p class="folder" style="margin-top:24px">[D] ./</p><button class="file" data-path="almanack/backtest-Nadaraya-whatson-envlop-trading.md" data-type="md">[M]  backtest-Nadaraya-whatson-envlop-trading.md</button><p class="status">NORMAL · select a file</p></aside></div>
<script>
const content=document.querySelector('#content');const esc=v=>v.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');const inline=v=>esc(v).replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img alt="$1" src="$2">').replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');
function markdown(src){const lines=src.replace(/\r/g,'').split('\n');let out='',code=false,list=false;for(const line of lines){if(line.startsWith('```')){out+=code?'</code></pre>':'<pre><code>';code=!code;continue}if(code){out+=esc(line)+'\n';continue}if(!line.trim()){if(list){out+='</ul>';list=false}continue}const h=line.match(/^(#{1,3})\s+(.+)$/);if(h)out+=`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;else if(line.startsWith('> '))out+=`<blockquote>${inline(line.slice(2))}</blockquote>`;else if(/^[-*]\s+/.test(line)){if(!list){out+='<ul>';list=true}out+=`<li>${inline(line.replace(/^[-*]\s+/,''))}</li>`}else out+=`<p>${inline(line)}</p>`}if(list)out+='</ul>';return out}
async function openFile(button){document.querySelectorAll('.file').forEach(x=>x.classList.toggle('active',x===button));const path=button.dataset.path;content.innerHTML='<p>Loading…</p>';try{const res=await fetch(path);if(!res.ok)throw Error();const src=await res.text();content.innerHTML=button.dataset.type==='md'?markdown(src):`<iframe title="${path.split('/').pop()}" src="${path}"></iframe>`}catch(e){content.innerHTML='<p>Could not load this file.</p>'}}
document.querySelectorAll('.file').forEach(x=>x.addEventListener('click',()=>openFile(x)));openFile(document.querySelector('.active'));
</script></body></html>
