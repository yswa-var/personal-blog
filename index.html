<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Almanack</title>
<style>
:root{color-scheme:light;--ink:#20201d;--muted:#85857d;--line:#deded7;--paper:#f8f8f4;--panel:#f0f0eb}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{min-height:100vh;background:var(--paper);color:var(--ink);font:15px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.app{display:grid;grid-template-columns:minmax(0,1fr) 280px;min-height:100vh}.reader{min-width:0;padding:clamp(28px,6vw,84px) clamp(24px,8vw,140px)}.reader-header{display:flex;justify-content:space-between;gap:20px;padding-bottom:18px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}.reader-header strong{color:var(--ink);font-size:15px;font-weight:500}.content{max-width:820px;margin:54px auto 0}.content h1{font-size:clamp(30px,5vw,58px);line-height:1.05;letter-spacing:-.07em;font-weight:500;margin:0 0 28px}.content h2{font-size:24px;margin:42px 0 12px}.content h3{font-size:17px;margin:30px 0 8px}.content p{max-width:720px;margin:0 0 20px}.content a{color:inherit}.content img{max-width:100%;height:auto}.content blockquote{margin:28px 0;padding-left:18px;border-left:2px solid var(--ink);color:#575750}.content pre{overflow-x:auto;padding:18px;background:#e9e9e3;font-size:13px}.content code{font:inherit;background:#e9e9e3;padding:2px 4px}.content pre code{padding:0;background:none}.explorer{padding:28px 22px;background:var(--panel);border-left:1px solid var(--line)}.explorer h1{margin:0 0 34px;font-size:16px;font-weight:500}.folder{color:var(--muted);font-size:12px;margin:0 0 10px}.file{display:block;width:100%;padding:9px 10px;border:0;border-left:2px solid transparent;background:none;color:var(--ink);cursor:pointer;text-align:left;font:inherit;font-size:12px;overflow-wrap:anywhere}.file:hover,.file.active{background:#e4e4de;border-left-color:var(--ink)}.status{margin-top:38px;color:var(--muted);font-size:11px}iframe{display:block;width:100%;min-height:70vh;border:0}@media(max-width:700px){.app{grid-template-columns:1fr}.explorer{order:-1;border-left:0;border-bottom:1px solid var(--line);padding:20px 24px}.explorer h1{margin-bottom:16px}.file{display:inline-block;width:auto;margin-right:4px}.status{display:none}}
</style></head><body>
<div class="app"><main class="reader"><header class="reader-header"><strong id="file-title">about.html</strong><span id="file-type">HTML</span></header><article class="content" id="content" aria-live="polite"></article></main><aside class="explorer" aria-label="File explorer"><h1>almanack/</h1><p class="folder">me?/</p><button class="file active" data-path="almanack/me%3F/about.html" data-type="html">about.html</button><p class="folder" style="margin-top:24px">./</p><button class="file" data-path="almanack/backtest-Nadaraya-whatson-envlop-trading.md" data-type="md">backtest-Nadaraya-whatson-envlop-trading.md</button><p class="status">Select a file to read</p></aside></div>
<script>
const content=document.querySelector('#content'),title=document.querySelector('#file-title'),type=document.querySelector('#file-type');const esc=v=>v.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');const inline=v=>esc(v).replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img alt="$1" src="$2">').replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');
function markdown(src){const lines=src.replace(/\r/g,'').split('\n');let out='',code=false,list=false;for(const line of lines){if(line.startsWith('```')){out+=code?'</code></pre>':'<pre><code>';code=!code;continue}if(code){out+=esc(line)+'\n';continue}if(!line.trim()){if(list){out+='</ul>';list=false}continue}const h=line.match(/^(#{1,3})\s+(.+)$/);if(h)out+=`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;else if(line.startsWith('> '))out+=`<blockquote>${inline(line.slice(2))}</blockquote>`;else if(/^[-*]\s+/.test(line)){if(!list){out+='<ul>';list=true}out+=`<li>${inline(line.replace(/^[-*]\s+/,''))}</li>`}else out+=`<p>${inline(line)}</p>`}if(list)out+='</ul>';return out}
async function openFile(button){document.querySelectorAll('.file').forEach(x=>x.classList.toggle('active',x===button));const path=button.dataset.path;title.textContent=path.split('/').pop();type.textContent=button.dataset.type.toUpperCase();content.innerHTML='<p>Loading…</p>';try{const res=await fetch(path);if(!res.ok)throw Error();const src=await res.text();content.innerHTML=button.dataset.type==='md'?markdown(src):`<iframe title="${title.textContent}" src="${path}"></iframe>`}catch(e){content.innerHTML='<p>Could not load this file.</p>'}}
document.querySelectorAll('.file').forEach(x=>x.addEventListener('click',()=>openFile(x)));openFile(document.querySelector('.active'));
</script></body></html>
