<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HI</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        background: #000;
        color: #fff;
      }

      h1 {
        margin: 0;
        font-size: clamp(4rem, 18vw, 12rem);
        font-weight: 700;
        letter-spacing: -0.08em;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>HI</h1>
    </main>
  </body>
</html>
